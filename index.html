<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>我的火柴人</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    background: #0f0f1e;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: none; user-select: none;
  }
  canvas { display: block; }

  #tip {
    position: fixed; bottom: 14px; left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,.4);
    font-size: 12px; z-index: 10; pointer-events: none;
  }
  #tip b { color: #ff9ecb; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="tip">
  <b>你</b>：A / ← 向左 &nbsp;·&nbsp; D / → 向右 &nbsp;·&nbsp; 手机按住屏幕左右两边
</div>

<script>

  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const MOVE_SPEED = 4.5;
  const GROUND_OFFSET = 100;

  const player = {
    x: W * 0.5,
    vx: 0,
    facing: 1,
    walkPhase: 0,
    color: '#6ec6ff',
    name: '我'
  };

  function groundY() { return H - GROUND_OFFSET; }

  // ===== 内置头像（画在 canvas 上） =====
  const headCanvas = document.createElement('canvas');
  headCanvas.width = 128;
  headCanvas.height = 128;

  (function drawHead() {
    const g = headCanvas.getContext('2d');

    // 圆形底
    const grad = g.createRadialGradient(64, 50, 10, 64, 64, 64);
    grad.addColorStop(0, '#ffe9b0');
    grad.addColorStop(1, '#ffb07a');
    g.fillStyle = grad;
    g.beginPath(); g.arc(64, 64, 64, 0, Math.PI * 2); g.fill();

    // 眼睛
    g.fillStyle = '#3a2a1a';
    g.beginPath(); g.arc(46, 58, 7, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(82, 58, 7, 0, Math.PI * 2); g.fill();

    // 腮红
    g.fillStyle = 'rgba(255,120,140,.7)';
    g.beginPath(); g.arc(36, 76, 9, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(92, 76, 9, 0, Math.PI * 2); g.fill();

    // 微笑
    g.strokeStyle = '#3a2a1a';
    g.lineWidth = 3.5; g.lineCap = 'round';
    g.beginPath(); g.arc(64, 72, 18, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();

    // 外圈
    g.beginPath(); g.arc(64, 64, 62, 0, Math.PI * 2);
    g.strokeStyle = '#ffffff'; g.lineWidth = 4; g.stroke();
  })();

  // ===== 键盘 =====
  const keys = { left: false, right: false };
  window.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft') { keys.left = true; e.preventDefault(); }
    if (k === 'd' || k === 'arrowright') { keys.right = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft') { keys.left = false; e.preventDefault(); }
    if (k === 'd' || k === 'arrowright') { keys.right = false; e.preventDefault(); }
  });

  // ===== 触摸 =====
  let tL = false, tR = false;
  function pointer(e, down) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    if (x < W / 2) { tL = down; tR = false; }
    else { tR = down; tL = false; }
  }
  canvas.addEventListener('touchstart', function (e) { pointer(e, true); e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchend',   function (e) { pointer(e, false); e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchmove',  function (e) { pointer(e, true); e.preventDefault(); }, {passive:false});
  canvas.addEventListener('mousedown',  function (e) { pointer(e, true); });
  canvas.addEventListener('mouseup',    function (e) { pointer(e, false); });
  canvas.addEventListener('mouseleave', function () { tL = tR = false; });

  // ===== 更新 =====
  function update() {
    const left  = keys.left  || tL;
    const right = keys.right || tR;

    if (left && !right) { player.vx = -MOVE_SPEED; player.facing = -1; }
    else if (right && !left) { player.vx = MOVE_SPEED; player.facing = 1; }
    else { player.vx = 0; }

    player.x += player.vx;
    if (player.vx !== 0) player.walkPhase += 0.28;

    const margin = 40;
    if (player.x < margin) player.x = margin;
    if (player.x > W - margin) player.x = W - margin;
  }

  // ===== 绘制 =====

    const x = player.x;
    const y = groundY();
    const walk = Math.sin(player.walkPhase) * (player.vx !== 0 ? 1 : 0);

    const headR = 32;

    const shoulderY = y - 104;

    ctx.fillStyle = player.color;

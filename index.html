
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>我的火柴人</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    background: #0f0f1e;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: none; user-select: none;
  }
  canvas { display: block; }

  /* 上传头像按钮 */
  #uploadBox {
    position: fixed; top: 14px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex; align-items: center; gap: 10px;
    background: rgba(0,0,0,.55);
    padding: 8px 14px;
    border-radius: 999px;
    color: #fff; font-size: 13px;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.1);
  }
  #uploadBox label {
    cursor: pointer;
    background: linear-gradient(135deg,#ff8fc0,#b18fff);
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12px;
  }
  #fileInput { display: none; }

  #tip {
    position: fixed; bottom: 14px; left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,.4);
    font-size: 12px; z-index: 10; pointer-events: none;
  }
  #tip b { color: #ff9ecb; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="uploadBox">
  <span>🖼️ 换头像</span>
  <label for="fileInput">选择图片</label>
  <input type="file" id="fileInput" accept="image/*">
</div>

<div id="tip">
  <b>你</b>：A / ← 向左 &nbsp;·&nbsp; D / → 向右 &nbsp;·&nbsp; 手机按住屏幕左右两边
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('game');

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  const GROUND_OFFSET = 100;

  const player = {

    y: 0,
    vx: 0,
    facing: 1,
    walkPhase: 0,
    color: '#6ec6ff',
    name: '我'

  // ===== 头像图片 =====
  const headImg = new Image();

  // 默认头像（如果用户不上传，就用一个默认的可爱笑脸）
  function makeDefaultHead() {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const g = c.getContext('2d');
    // 圆形底
    const grad = g.createRadialGradient(64, 50, 10, 64, 64, 64);
    grad.addColorStop(0, '#ffe9b0');
    grad.addColorStop(1, '#ffb07a');
    g.fillStyle = grad;
    g.beginPath(); g.arc(64, 64, 64, 0, Math.PI*2); g.fill();
    // 眼睛
    g.fillStyle = '#3a2a1a';
    g.beginPath(); g.arc(46, 58, 7, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(82, 58, 7, 0, Math.PI*2); g.fill();
    // 腮红
    g.fillStyle = 'rgba(255,120,140,.7)';
    g.beginPath(); g.arc(36, 76, 9, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(92, 76, 9, 0, Math.PI*2); g.fill();
    // 微笑
    g.strokeStyle = '#3a2a1a';
    g.lineWidth = 3.5; g.lineCap = 'round';
    g.beginPath(); g.arc(64, 72, 18, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
    // 返回图片
    const img = new Image();
    img.src = c.toDataURL();
    return img;
  }

  // 处理成圆形头像
  function processHeadToCircle(img) {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const g = c.getContext('2d');

    // 计算居中裁剪
    const iw = img.width, ih = img.height;
    const scale = Math.max(size / iw, size / ih);
    const dw = iw * scale, dh = ih * scale;
    const dx = (size - dw) / 2, dy = (size - dh) / 2;

    // 圆形裁剪路径
    g.save();
    g.beginPath();
    g.arc(size/2, size/2, size/2, 0, Math.PI*2);
    g.closePath();
    g.clip();

    // 画图
    g.drawImage(img, dx, dy, dw, dh);
    g.restore();

    // 外圈描边
    g.beginPath();
    g.arc(size/2, size/2, size/2 - 2, 0, Math.PI*2);
    g.strokeStyle = '#ffffff';
    g.lineWidth = 4;
    g.stroke();

    return c;
  }

  // 初始化默认头像
  headCanvas = (function () {
    const img = makeDefaultHead();
    // 等待默认头像生成完毕
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const g = c.getContext('2d');
    // 直接画默认头像（不用异步）
    g.save();
    g.beginPath(); g.arc(64, 64, 64, 0, Math.PI*2); g.clip();
    g.fillStyle = '#ffd9a0';
    g.fillRect(0, 0, 128, 128);
    g.restore();

    // 用默认头功能重新画一次，但为了保证同步，直接在初始化时用图片元素
    // 由于 Image 需要异步加载，用 canvas 手动绘制默认头像
    const cc = document.createElement('canvas');
    cc.width = 128; cc.height = 128;
    const gg = cc.getContext('2d');
    // 圆形底
    const grad = gg.createRadialGradient(64, 50, 10, 64, 64, 64);
    grad.addColorStop(0, '#ffe9b0');
    grad.addColorStop(1, '#ffb07a');
    gg.fillStyle = grad;
    gg.beginPath(); gg.arc(64, 64, 64, 0, Math.PI*2); gg.fill();
    // 眼睛
    gg.fillStyle = '#3a2a1a';
    gg.beginPath(); gg.arc(46, 58, 7, 0, Math.PI*2); gg.fill();
    gg.beginPath(); gg.arc(82, 58, 7, 0, Math.PI*2); gg.fill();
